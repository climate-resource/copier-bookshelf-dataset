name: Feedstock publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: climate-resource/bookshelf-actions/.github/workflows/feedstock-publish.yaml@v1
    with:
      api-base-url: ${{ vars.BOOKSHELF_API_BASE_URL || 'https://api.climateresource.com.au/bookshelf' }}
      token-url: ${{ vars.BOOKSHELF_TOKEN_URL }}
    secrets:
      BOOKSHELF_CLIENT_ID: ${{ secrets.BOOKSHELF_CLIENT_ID }}
      BOOKSHELF_CLIENT_SECRET: ${{ secrets.BOOKSHELF_CLIENT_SECRET }}
