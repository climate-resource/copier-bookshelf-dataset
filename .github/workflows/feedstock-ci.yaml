name: Feedstock CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run the feedstock
        required: false
        type: string
        default: "3.12"
      version:
        description: Single version to record. Records every version the recipes declare when left empty.
        required: false
        type: string
        default: ""
      recipes:
        description: Whitespace separated recipes, each declaring one volume and its books
        required: false
        type: string
        default: bookshelf.yaml
      main-ref:
        description: Branch a pull request is merged with to build the candidate
        required: false
        type: string
        default: main
      api-base-url:
        description: Bookshelf API base URL
        required: false
        type: string
        default: https://bookshelf.climateresource.com.au
      sdk-version:
        description: Exact bookshelf version the trusted preview job installs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bookshelf-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build the candidate
    runs-on: ubuntu-latest
    outputs:
      conflict: ${{ steps.candidate.outputs.conflict }}
      main-sha: ${{ steps.candidate.outputs.main-sha }}
      candidate-tree: ${{ steps.candidate.outputs.candidate-tree }}
    steps:
      - name: Check out feedstock
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Check out matching feedstock action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .copier-bookshelf-dataset
          persist-credentials: false

      - name: Merge the head with main
        id: candidate
        env:
          MAIN_REF: ${{ inputs.main-ref }}
        run: bash .copier-bookshelf-dataset/actions/record-bundle/candidate.sh

      - name: Write the candidate identity
        env:
          HEAD_SHA: ${{ steps.candidate.outputs.head-sha }}
          MAIN_SHA: ${{ steps.candidate.outputs.main-sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.candidate-tree }}
        run: |
          jq -n \
            --arg head_sha "${HEAD_SHA}" \
            --arg main_sha "${MAIN_SHA}" \
            --arg candidate_tree "${CANDIDATE_TREE}" \
            --argjson run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            '$ARGS.named' > candidate.json
          cat candidate.json

      - name: Upload the candidate identity
        uses: actions/upload-artifact@v6
        with:
          name: bookshelf-candidate
          path: candidate.json
          if-no-files-found: error
          overwrite: true

  targets:
    name: List the targets
    needs: candidate
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out feedstock
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Check out matching feedstock action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .copier-bookshelf-dataset
          persist-credentials: false

      - name: Rebuild the candidate
        env:
          MAIN_REF: ${{ inputs.main-ref }}
          MAIN_SHA: ${{ needs.candidate.outputs.main-sha }}
          EXPECTED_TREE: ${{ needs.candidate.outputs.candidate-tree }}
        run: bash .copier-bookshelf-dataset/actions/record-bundle/candidate.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: "true"

      - name: List every target the recipes declare
        id: targets
        env:
          RECIPES: ${{ inputs.recipes }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          uv sync --locked
          # shellcheck disable=SC2086 # RECIPES is a whitespace separated list
          uv run python .copier-bookshelf-dataset/actions/record-bundle/targets.py \
            --output targets.json --version "${VERSION}" ${RECIPES}
          cat targets.json

      - name: Upload the target list
        uses: actions/upload-artifact@v6
        with:
          name: bookshelf-targets
          path: targets.json
          if-no-files-found: error
          overwrite: true

  record:
    name: Record ${{ matrix.target.volume }} ${{ matrix.target.version }}
    needs: [candidate, targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - name: Check out feedstock
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Check out matching feedstock action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .copier-bookshelf-dataset
          persist-credentials: false

      - name: Rebuild the candidate
        env:
          MAIN_REF: ${{ inputs.main-ref }}
          MAIN_SHA: ${{ needs.candidate.outputs.main-sha }}
          EXPECTED_TREE: ${{ needs.candidate.outputs.candidate-tree }}
        run: bash .copier-bookshelf-dataset/actions/record-bundle/candidate.sh

      - name: Record and validate the bundle
        uses: ./.copier-bookshelf-dataset/actions/record-bundle
        with:
          python-version: ${{ inputs.python-version }}
          recipe: ${{ matrix.target.recipe }}
          version: ${{ matrix.target.version }}
          volume: ${{ matrix.target.volume }}

      - name: Upload the bundle and its outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bookshelf-bundle-${{ matrix.target.volume }}-${{ matrix.target.version }}
          path: bundle
          if-no-files-found: error
          overwrite: true

  candidate-outcome:
    name: candidate outcome
    if: always()
    needs: [candidate, targets, record]
    runs-on: ubuntu-latest
    steps:
      - name: Check out matching feedstock action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .copier-bookshelf-dataset
          persist-credentials: false

      # A job that never ran leaves nothing to download, which the report counts against the candidate.
      - name: Download the candidate identity
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bookshelf-candidate
          path: candidate

      - name: Download the target list
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bookshelf-targets
          path: targets

      - name: Download every outcome
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: bookshelf-bundle-*
          path: outcomes

      - name: Check every expected book was validated
        env:
          CONFLICT: ${{ needs.candidate.outputs.conflict }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          TARGETS_RESULT: ${{ needs.targets.result }}
          RECORD_RESULT: ${{ needs.record.result }}
        run: |
          set -euo pipefail
          python3 .copier-bookshelf-dataset/actions/record-bundle/aggregate.py \
            --targets targets/targets.json \
            --outcomes-dir outcomes \
            --candidate candidate/candidate.json \
            --job "candidate=${CANDIDATE_RESULT}" \
            --job "targets=${TARGETS_RESULT}" \
            --job "record=${RECORD_RESULT}" \
            --conflict "${CONFLICT}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"

  # The one job that can mint the OIDC token, so it never runs a line of the pull request.
  preview:
    name: upload preview
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [candidate, targets, record]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out matching feedstock action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .copier-bookshelf-dataset
          persist-credentials: false

      # A job that never ran leaves nothing to download, which the next step reports.
      - name: Download the target list
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bookshelf-targets
          path: artifacts

      - name: Download every bundle
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: bookshelf-bundle-*
          path: artifacts

      - name: Resolve the upload inputs
        run: |
          set -euo pipefail
          python3 .copier-bookshelf-dataset/actions/record-bundle/preview_inputs.py \
            --artifacts artifacts \
            --summary "${GITHUB_STEP_SUMMARY}" >> "${GITHUB_ENV}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the pinned SDK
        env:
          SDK_VERSION: ${{ inputs.sdk-version }}
        run: |
          set -euo pipefail
          uv tool install "bookshelf==${SDK_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # The identity comes from the event and the candidate job, which PR code cannot overwrite.
      - name: Upload the preview
        env:
          API_BASE_URL: ${{ inputs.api-base-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_SHA: ${{ needs.candidate.outputs.main-sha }}
          CANDIDATE_TREE: ${{ needs.candidate.outputs.candidate-tree }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # BUNDLES is a whitespace separated list
          bookshelf --api-url "${API_BASE_URL}" \
          preview upload ${BUNDLES} \
            --repository "${GITHUB_REPOSITORY}" \
            --pr "${PR_NUMBER}" \
            --pr-url "${PR_URL}" \
            --head-sha "${HEAD_SHA}" \
            --main-sha "${MAIN_SHA}" \
            --tree "${CANDIDATE_TREE}" \
            --run-id "${GITHUB_RUN_ID}" \
            --json > preview.json

      # A failed preview still exists, so its links are reported too.
      - name: Report the preview
        if: ${{ !cancelled() && hashFiles('preview.json') != '' }}
        run: |
          set -euo pipefail
          jq -e .preview_id preview.json > /dev/null || exit 0
          {
            echo "## Preview"
            echo
            jq -r '"- Preview: `\(.preview_id)` (\(.state))",
                   "- Proposal: \(.proposal_url)",
                   "- Books: \(.preview_url)"' preview.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the preview summary
        if: ${{ !cancelled() && hashFiles('preview.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: bookshelf-preview
          path: preview.json
          if-no-files-found: error
          overwrite: true
