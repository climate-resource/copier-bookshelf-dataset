name: Regenerate fixtures

# Renovate bumps pins inside template/, but the rendered copies under tests/regression/ctt
# only change when ctt runs. Run it here and push the result back onto the Renovate branch.

on:
  pull_request:
    branches: [main]
    paths:
      - copier.yaml
      - ctt.toml
      - "template/**"

permissions:
  contents: read

jobs:
  regenerate:
    if: contains(fromJSON('["renovate[bot]", "cr-renovator[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          # GITHUB_TOKEN pushes never trigger CI, so use the organisation PAT.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Render the regression fixtures
        run: uv run --locked ctt
      - name: Push the regenerated fixtures
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "fixtures already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate the regression fixtures"
          git push
