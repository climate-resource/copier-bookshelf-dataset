name: Bump version

# Manually bump the version, build the CHANGELOG from the changelog/ fragments,
# tag, and publish the GitHub release.
#
# The work lives in the shared climate-resource/github-actions workflow.

on:
  workflow_dispatch:
    inputs:
      bump_rule:
        description: Version bump segment(s) passed to `uv version --bump`.
        type: choice
        default: stable
        required: true
        options:
          - stable
          - patch
          - minor
          - major
          - alpha
          - beta
          - "patch alpha"
          - "minor alpha"
          - "major alpha"

jobs:
  bump:
    uses: climate-resource/github-actions/.github/workflows/bump.yaml@4760a617b4820ca47e69034e8f926b754d6d4192 # v1.8.1
    permissions:
      contents: write
    with:
      bump-rule: ${{ inputs.bump_rule }}
      python-version: "3.12"
      create-release: true
      release-draft: false
