name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']


jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          # GitHub added these reusable workflow identity properties before
          # actionlint's schema learned them.
          flags: >-
            -ignore property.*workflow_(repository|sha).*not.defined

  linting:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      PRE_COMMIT_HOME: /tmp/.cache/pre-commit
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the project
        run: uv sync --locked
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: /tmp/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit
      - name: pre-commit
        run: |
          # Runs ctt as well
          uvx pre-commit run --all-files

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version:
          - "3.12"
          - "3.13"
    runs-on: "${{ matrix.os }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Generate the feedstock fixtures
        # The recording tests sync a generated feedstock against its lock file, and
        # copier writes that file rather than the repository committing it.
        # Without this step those tests skip and recording goes uncovered.
        run: |
          uv run --locked ctt
      - name: Run tests
        run: |
          uv run --locked pytest tests -r a -v
