name: CI

on:
  pull_request:
    # Jobs skip drafts, so marking a PR ready must trigger a run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']


jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          # GitHub added these reusable workflow identity properties before
          # actionlint's schema learned them.
          flags: >-
            -ignore property.*workflow_(repository|sha).*not.defined

  linting:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      PRE_COMMIT_HOME: /tmp/.cache/pre-commit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the project
        run: uv sync --locked
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: /tmp/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit
      - name: pre-commit
        run: |
          # Runs ctt as well
          uvx pre-commit run --all-files

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version:
          - "3.12"
          - "3.13"
    runs-on: "${{ matrix.os }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install actionlint
        # The rendered-feedstock tests lint the generated workflows, and skip when
        # actionlint is not on PATH.
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.9"
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          install -D actionlint "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Run tests
        run: |
          uv run --locked pytest -n auto -r a -v
