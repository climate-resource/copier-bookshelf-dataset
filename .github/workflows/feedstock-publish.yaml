name: Feedstock publish

on:
  workflow_call:
    inputs:
      api-base-url:
        description: Bookshelf API base URL
        required: false
        type: string
        default: https://api.climateresource.com.au/bookshelf
      token-url:
        description: WorkOS AuthKit client credentials token URL
        required: true
        type: string
      python-version:
        description: Python version used to run the feedstock
        required: false
        type: string
        default: "3.12"
      version:
        description: Single version to publish. Publishes every version the recipe declares when left empty.
        required: false
        type: string
        default: ""
    secrets:
      BOOKSHELF_CLIENT_ID:
        description: WorkOS M2M client ID
        required: true
      BOOKSHELF_CLIENT_SECRET:
        description: WorkOS M2M client secret
        required: true
    outputs:
      outcome:
        description: One publish summary per version, as a JSON array
        value: ${{ jobs.publish.outputs.outcome }}

permissions:
  contents: read

jobs:
  publish:
    name: Record and publish bundles
    runs-on: ubuntu-latest
    environment: deploy
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    steps:
      - name: Check out feedstock
        uses: actions/checkout@v6

      - name: Check out matching feedstock action
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .copier-bookshelf-dataset
          persist-credentials: false

      - name: Record and validate bundles
        id: record
        uses: ./.copier-bookshelf-dataset/actions/record-bundle
        with:
          python-version: ${{ inputs.python-version }}
          version: ${{ inputs.version }}

      - name: Exchange M2M credentials
        id: token
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.BOOKSHELF_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BOOKSHELF_CLIENT_SECRET }}
          TOKEN_URL: ${{ inputs.token-url }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --request POST "${TOKEN_URL}" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}")"
          token="$(jq -er '.access_token' <<<"${response}")"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Replay bundles
        id: publish
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api-base-url }}
          BUNDLES: ${{ steps.record.outputs.bundles }}
          # The CLI reads the credential from the environment,
          # so the token never reaches argv or the process list.
          BOOKSHELF_TOKEN: ${{ steps.token.outputs.token }}
        # Every bundle is replayed. Publishing an unchanged book is idempotent and leaves the edition where it was.
        run: |
          set -euo pipefail
          results="$(mktemp)"
          echo "## Publish outcome" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          for bundle in ${BUNDLES}; do
            result="$(uv run bookshelf publish "${bundle}" \
              --api-url "${API_BASE_URL}" \
              --json)"
            printf '%s\n' "${result}" >> "${results}"
            echo "* \`${result}\`" >> "${GITHUB_STEP_SUMMARY}"
          done
          echo "outcome=$(jq -sc . "${results}")" >> "${GITHUB_OUTPUT}"
