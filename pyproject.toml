[project]
name = "copier-bookshelf-dataset"
version = "0.3.0b1"
description = "Copier template for a bookshelf dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    # The rendered-feedstock tests drive copier directly, rather than through ctt.
    "copier>=9.4",
    "copier-template-tester>=2.5.0",
    # The tests render the copier.yaml validators the way Copier does.
    "jinja2>=3.1",
    "jinja2-ansible-filters>=1.3",
    "pytest>=8.3.3",
    "pytest-xdist>=3.6.1",
    "pyyaml>=6.0",
    "towncrier>=25.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The rendered fixtures and the template are source for generated feedstocks, not tests to collect.
norecursedirs = ["tests/regression/ctt", "template"]
markers = [
    "slow: renders the template and runs the feedstock's own toolchain (deselect with -m 'not slow')",
]
