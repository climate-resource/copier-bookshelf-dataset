name: "Record Bookshelf bundle"
description: "Record and validate a feedstock's books without API credentials"

inputs:
  python-version:
    description: "Python version used to run the feedstock"
    required: false
    default: "3.12"
  recipe:
    description: "Sectioned Bookshelf recipe"
    required: false
    default: "bookshelf.yaml"
  bundle:
    description: "Directory the per-version bundles are written under"
    required: false
    default: "bundle"
  version:
    description: "Single version to record. Records every version the recipe declares when left empty."
    required: false
    default: ""
  volume:
    description: "Volume the recorded version belongs to, as reported in outcome.json"
    required: false
    default: ""
  write-outcome:
    description: "Write outcome.json under the bundle directory when a single version is recorded"
    required: false
    default: "true"

outputs:
  bundles:
    description: "Space separated bundle directories, one per recorded version"
    value: ${{ steps.record.outputs.bundles }}

runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: "true"

    - name: Derive fetched input cache key
      id: raw-cache-key
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
      run: python3 "${GITHUB_ACTION_PATH}/cache_key.py" "${RECIPE}"

    - name: Restore fetched inputs
      if: steps.raw-cache-key.outputs.found == 'true'
      uses: actions/cache@v6
      with:
        path: .cache
        key: bookshelf-content-${{ runner.os }}-${{ steps.raw-cache-key.outputs.key }}

    - name: Install locked feedstock environment
      shell: bash
      run: uv sync --locked

    - name: Resolve the versions to record
      id: versions
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        VERSION: ${{ inputs.version }}
      # The recipe is the one place versions are written down, so an empty input
      # means every book rather than a list repeated in the caller workflow.
      run: uv run python "${GITHUB_ACTION_PATH}/recipe_versions.py" "${RECIPE}"

    - name: Record and validate every version
      id: record
      # The next step reports the outcome, so a failure here still leaves one behind.
      continue-on-error: true
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        BUNDLE: ${{ inputs.bundle }}
        VERSIONS: ${{ steps.versions.outputs.versions }}
        # The SDK caches fetched content under its platform directory by default,
        # which no runner keeps between jobs.
        BOOKSHELF_CACHE_DIR: .cache
      # This step lays the bundle directories out, so it reports them rather than leaving
      # a caller to join a bundle root and a version itself.
      # It also owns the bundle directory in CI, so it replaces whatever is there.
      # A bare `bookshelf record` refuses to, which is what protects a local bundle under review.
      run: |
        set -euo pipefail
        stage=""
        version=""
        trap 'echo "reason=bookshelf ${stage} failed for ${version}" >> "${GITHUB_OUTPUT}"' ERR
        bundles=""
        for version in ${VERSIONS}; do
          bundle="${BUNDLE}/${version}"
          echo "::group::${version}"
          stage=record
          uv run bookshelf record \
            --recipe "${RECIPE}" \
            --bundle "${bundle}" \
            --version "${version}" \
            --force \
            --json
          stage=validate
          uv run bookshelf validate "${bundle}" --json
          echo "::endgroup::"
          bundles="${bundles}${bundles:+ }${bundle}"
        done
        echo "bundles=${bundles}" >> "${GITHUB_OUTPUT}"

    - name: Report the outcome
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
        VOLUME: ${{ inputs.volume }}
        VERSION: ${{ inputs.version }}
        WRITE_OUTCOME: ${{ inputs.write-outcome }}
        OUTCOME: ${{ steps.record.outcome }}
        REASON: ${{ steps.record.outputs.reason }}
      run: |
        set -euo pipefail
        status=validated
        reason=""
        if [[ "${OUTCOME}" != "success" ]]; then
          status=failed
          reason="${REASON:-bookshelf record failed}"
        fi
        if [[ "${WRITE_OUTCOME}" == "true" && -n "${VERSION}" ]]; then
          mkdir -p "${BUNDLE}"
          jq -n \
            --arg volume "${VOLUME}" \
            --arg version "${VERSION}" \
            --arg status "${status}" \
            --arg reason "${reason}" \
            '{volume: $volume, version: $version, status: $status, reason: $reason}' \
            > "${BUNDLE}/outcome.json"
        fi
        if [[ "${status}" != "validated" ]]; then
          echo "::error::${reason}"
          exit 1
        fi
