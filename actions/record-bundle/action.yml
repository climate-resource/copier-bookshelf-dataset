name: "Record Bookshelf bundle"
description: "Record and validate a feedstock bundle without API credentials"

inputs:
  python-version:
    description: "Python version used to run the feedstock"
    required: false
    default: "3.12"
  build-file:
    description: "Standalone Jupytext build file"
    required: false
    default: "build.py"
  recipe:
    description: "Slim Bookshelf recipe"
    required: false
    default: "bookshelf.yaml"
  bundle:
    description: "Output bundle directory"
    required: false
    default: "bundle"
  cache-path:
    description: "Raw input cache directory"
    required: false
    default: ".cache"

outputs:
  bundle-path:
    description: "Recorded bundle directory"
    value: ${{ inputs.bundle }}

runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: "true"

    - name: Derive raw input cache key
      id: raw-cache-key
      shell: bash
      env:
        BUILD_FILE: ${{ inputs.build-file }}
      run: python3 "${GITHUB_ACTION_PATH}/cache_key.py" "${BUILD_FILE}"

    - name: Restore raw inputs
      if: steps.raw-cache-key.outputs.found == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ inputs.cache-path }}
        key: bookshelf-raw-${{ runner.os }}-${{ steps.raw-cache-key.outputs.key }}

    - name: Install locked feedstock environment
      shell: bash
      run: uv sync --locked

    - name: Record bundle
      shell: bash
      env:
        BUILD_FILE: ${{ inputs.build-file }}
        RECIPE: ${{ inputs.recipe }}
        BUNDLE: ${{ inputs.bundle }}
      # This step owns the bundle directory in CI, so it replaces whatever is there.
      # A bare `bookshelf record` refuses to, which is what protects a local bundle under review.
      run: >-
        uv run bookshelf record "${BUILD_FILE}"
        --recipe "${RECIPE}"
        --bundle "${BUNDLE}"
        --force
        --json

    - name: Validate bundle
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
      # The same validation a feedstock runs locally through `make run`.
      run: uv run bookshelf validate "${BUNDLE}" --json
