name: "Record Bookshelf bundle"
description: "Record and validate a feedstock's books without API credentials"

inputs:
  python-version:
    description: "Python version used to run the feedstock"
    required: false
    default: "3.12"
  build-file:
    description: "Standalone Jupytext build file"
    required: false
    default: "build.py"
  recipe:
    description: "Sectioned Bookshelf recipe"
    required: false
    default: "bookshelf.yaml"
  bundle:
    description: "Directory the per-version bundles are written under"
    required: false
    default: "bundle"
  version:
    description: "Single version to record. Records every version the recipe declares when left empty."
    required: false
    default: ""
  cache-path:
    description: "Raw input cache directory"
    required: false
    default: ".cache"

outputs:
  bundle-path:
    description: "Directory holding one bundle per recorded version"
    value: ${{ inputs.bundle }}
  versions:
    description: "Space separated versions that were recorded, each a directory under bundle-path"
    value: ${{ steps.versions.outputs.versions }}

runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: "true"

    - name: Derive raw input cache key
      id: raw-cache-key
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
      run: python3 "${GITHUB_ACTION_PATH}/cache_key.py" "${RECIPE}"

    - name: Restore raw inputs
      if: steps.raw-cache-key.outputs.found == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ inputs.cache-path }}
        key: bookshelf-raw-${{ runner.os }}-${{ steps.raw-cache-key.outputs.key }}

    - name: Install locked feedstock environment
      shell: bash
      run: uv sync --locked

    - name: Resolve the versions to record
      id: versions
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        VERSION: ${{ inputs.version }}
      # The recipe is the one place versions are written down, so an empty input
      # means every book rather than a list repeated in the caller workflow.
      run: |
        set -euo pipefail
        if [[ -n "${VERSION}" ]]; then
          echo "versions=${VERSION}" >> "${GITHUB_OUTPUT}"
        else
          uv run python "${GITHUB_ACTION_PATH}/recipe_versions.py" "${RECIPE}"
        fi

    - name: Record and validate every version
      shell: bash
      env:
        BUILD_FILE: ${{ inputs.build-file }}
        RECIPE: ${{ inputs.recipe }}
        BUNDLE: ${{ inputs.bundle }}
        VERSIONS: ${{ steps.versions.outputs.versions }}
      # This step owns the bundle directory in CI, so it replaces whatever is there.
      # A bare `bookshelf record` refuses to, which is what protects a local bundle under review.
      run: |
        set -euo pipefail
        for version in ${VERSIONS}; do
          echo "::group::${version}"
          uv run bookshelf record "${BUILD_FILE}" \
            --recipe "${RECIPE}" \
            --bundle "${BUNDLE}/${version}" \
            --version "${version}" \
            --force \
            --json
          uv run bookshelf validate "${BUNDLE}/${version}" --json
          echo "::endgroup::"
        done
