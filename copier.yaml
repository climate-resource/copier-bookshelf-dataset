author:
    type: str
    help: What is your name? (We use this to write `pyproject.toml`)
    placeholder: "John Bloggs"

author_email:
    type: str
    help: What is your email? (We use this to write `pyproject.toml`)
    placeholder: "john.bloggs@climate-resource.com"

dataset_name:
    type: str
    help: >-
        What is the short name of the dataset?
        This will be used to name the dataset and must be lowercase and contain no spaces.
    placeholder: "example"
    validator: >-
        {% if not (dataset_name | regex_search('^[a-z][a-z0-9-]+$')) %}
        dataset_name must be all lower case, contain no spaces and use hyphens for word separators
        {% endif %}

dataset_name_human:
    type: str
    help: >-
        What is the human-readable name of your project? This will become the
        header of your README so can include spaces, capital letters etc.
    default: "{{ dataset_name | replace('-', ' ') | title }}"

dataset_description:
    type: str
    help: What is the short description of the dataset?
    placeholder: >-
        Project for doing a cool thing. Should be one or two sentences.

project_url:
    type: str
    when: false
    help: What is the URL for your project?
    default: |-
        https://github.com/climate-resource/bookshelf-{{ dataset_name }}
    validator: >-
        {% if not (project_url | regex_search('^https://\\S*(github.com)/\\S*$')) %}
        That doesn't look like a valid URL, please check. Only GitHub URLs are supported.
        {% endif %}

bookshelf_sdk_version:
    type: str
    when: false
    help: Which exact Bookshelf SDK version should the feedstock and preview job use?
    default: "1.0.0b8"

extra_recipes:
    type: yaml
    when: false
    help: >-
        Which extra volume names should get a bookshelf-<name>.yaml recipe?
        Enter a YAML list.
    default: []
    validator: >-
        {% if extra_recipes is not sequence or extra_recipes is string or extra_recipes is mapping %}
        extra_recipes must be a list of volume names
        {% else %}
        {% for name in extra_recipes %}
        {% if name is not string or not (name | regex_search('^[a-z][a-z0-9-]+$')) %}
        extra_recipes names must be lowercase and use hyphens for word separators
        {% endif %}
        {% endfor %}
        {% if extra_recipes | unique | list | length != extra_recipes | length %}
        extra_recipes names must be unique
        {% endif %}
        {% if dataset_name in extra_recipes %}
        extra_recipes must not repeat dataset_name
        {% endif %}
        {% endif %}

_envops:
    trim_blocks: true
    lstrip_blocks: true

_subdirectory: template
