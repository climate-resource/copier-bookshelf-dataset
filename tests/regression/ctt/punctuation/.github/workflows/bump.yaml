name: Bump version

# Manually bump the version, build the CHANGELOG from the changelog/ fragments,
# tag, and draft the GitHub release.
#
# The work lives in the shared climate-resource/github-actions workflow.
#
# The release is drafted rather than published.
# Publishing that draft by hand is what triggers the feedstock publish workflow.
# A release published by CI would not fire it,
# because releases created with GITHUB_TOKEN do not trigger other workflows.

on:
  workflow_dispatch:
    inputs:
      bump_rule:
        description: Version bump segment(s) passed to `uv version --bump`.
        type: choice
        default: patch
        required: true
        options:
          - patch
          - minor
          - major
          - stable
          - "patch alpha"
          - "minor alpha"
          - "major alpha"

jobs:
  bump:
    uses: climate-resource/github-actions/.github/workflows/bump.yaml@v1.6.0
    permissions:
      contents: write
    with:
      bump-rule: ${{ inputs.bump_rule }}
      python-version: "3.12"
      create-release: true
      release-draft: true
