# The recipe carries every fact about the books this feedstock produces,
# so build.py holds only the processing.
# Format: https://github.com/climate-resource/bookshelf/blob/feat/adopt-bookshelf-sdk/docs/explanation/recipe-format.md
volume:
  name: example
  maintainers:
    - name: "Tim Slim"
      email: timslim@climate-resource.com
  keywords:
    - example

# What every book starts from. A book may override any of it, field by field.
defaults:
  title: "Example Dataset"
  description: "Test project made with copier-template-tester"
  publisher: Climate Resource
  repository_url: https://github.com/climate-resource/ctt-project
  visibility: public
  authors:
    - name: "Tim Slim"
      email: timslim@climate-resource.com
  resources:
    # A resource type never moves between books, so it is stated once here.
    raw:
      type: tabular

build:
  notebook: build.py

# One entry per upstream version. `bookshelf record --version` picks one.
books:
  - version: "v0.1.0"
    license: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    description: >-
      The scaffolded example book.
      Replace it with the first real version of Example Dataset.
    resources:
      # A checked-in input needs no sha256, because the recorder hashes the file it reads.
      # Replace it with `uri:` and the `sha256:` the fetch is checked against.
      raw:
        path: inputs/raw.csv
