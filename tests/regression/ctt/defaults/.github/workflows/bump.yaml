name: Bump version

# Manually bump the version, build the CHANGELOG from the changelog/ fragments,
# tag, and draft the GitHub release.
#
# The release is drafted rather than published.
# Publishing that draft by hand is what triggers the feedstock publish workflow.
#
# After tagging, a follow-up commit lands a pre-release version on main so that
# subsequent commits do not share the tagged version.

on:
  workflow_dispatch:
    inputs:
      bump_rule:
        description: Version bump segment(s) passed to `uv version --bump`.
        type: choice
        default: patch
        required: true
        options:
          - patch
          - minor
          - major
          - stable
          - "patch alpha"
          - "minor alpha"
          - "major alpha"

jobs:
  bump:
    uses: climate-resource/github-actions/.github/workflows/bump.yaml@v1
    permissions:
      contents: write
    with:
      bump-rule: ${{ inputs.bump_rule }}
      python-version: "3.12"
      update-changelog: true
      create-release: true
