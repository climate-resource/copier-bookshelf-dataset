[project]
name = "bookshelf-multi-volume"
version = "0.1.0"
description = "Two volumes built from one feedstock."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bookshelf[publish]>=1.0,<2",
    "pandas>=2.2",
]

[tool.uv]
exclude-newer = "3 days"
exclude-newer-package = { bookshelf = false }
