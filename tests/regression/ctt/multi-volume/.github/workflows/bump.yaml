name: Bump version

# Manually bump the version, build the CHANGELOG from the changelog/ fragments,
# tag, and publish the GitHub release.
#
# The work lives in the shared climate-resource/github-actions workflow.
#
# The release records the changelog and publishes no data.
# The platform publishes a merged pull request from the preview that passed its check.

on:
  workflow_dispatch:
    inputs:
      bump_rule:
        description: Version bump segment(s) passed to `uv version --bump`.
        type: choice
        default: patch
        required: true
        options:
          - patch
          - minor
          - major
          - stable
          - alpha
          - beta
          - "patch alpha"
          - "minor alpha"
          - "major alpha"

jobs:
  bump:
    uses: climate-resource/github-actions/.github/workflows/bump.yaml@v1.6.0
    permissions:
      contents: write
    with:
      bump-rule: ${{ inputs.bump_rule }}
      python-version: "3.12"
      create-release: true
      release-draft: false
